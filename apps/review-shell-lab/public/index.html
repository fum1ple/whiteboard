<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'" />
    <title>Whiteboard shell comparison</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <script defer src="/assets/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">/dev/fast Whiteboard <span>Shell Lab</span></div>
      <div class="top-actions"><span id="status" role="status">Loading review…</span><button id="cli-run" type="button" disabled>Run review CLI</button></div>
    </header>
    <main id="app" aria-live="polite">
      <section class="loading">Connecting to the isolated Review API…</section>
    </main>
    <dialog id="cli-dialog">
      <form method="dialog"><div class="dialog-title">CLI output</div><button aria-label="Close">×</button></form>
      <pre id="cli-output"></pre>
    </dialog>
  </body>
</html>
