name: Review shell lab native builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/review-shell-lab/**"
      - "packages/review/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/shell-lab-native-build.yml"

permissions:
  contents: read

jobs:
  native-build:
    name: Build shells (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/review-desktop/code-oss/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Wails CLI
        run: |
          mkdir -p "$RUNNER_TEMP/shell-lab-tools"
          GOBIN="$RUNNER_TEMP/shell-lab-tools" go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          echo "$RUNNER_TEMP/shell-lab-tools" >> "$GITHUB_PATH"
      - run: node --test apps/review-shell-lab/test/*.test.mjs
      - run: pnpm --filter @dev.fast/review-shell-lab run build:electron
      - run: pnpm --filter @dev.fast/review-shell-lab run build:tauri
      - run: pnpm --filter @dev.fast/review-shell-lab run build:wails
